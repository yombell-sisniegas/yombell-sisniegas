<svg width="880" height="460" viewBox="0 0 880 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal session describing Yombell Sisniegas">
  <defs>
    <clipPath id="cmd1"><rect x="24" y="68" width="0" height="24"><animate attributeName="width" from="0" to="120" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="cmd2"><rect x="24" y="132" width="0" height="24"><animate attributeName="width" from="0" to="170" begin="2.2s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="cmd3"><rect x="24" y="222" width="0" height="24"><animate attributeName="width" from="0" to="230" begin="4.6s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="cmd4"><rect x="24" y="286" width="0" height="24"><animate attributeName="width" from="0" to="190" begin="6.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="cmd5"><rect x="24" y="350" width="0" height="24"><animate attributeName="width" from="0" to="200" begin="8.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Window -->
  <rect x="1" y="1" width="878" height="458" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <!-- Title bar -->
  <path d="M1 15C1 7.268 7.268 1 15 1H865C872.732 1 879 7.268 879 15V42H1V15Z" fill="#16213B"/>
  <line x1="1" y1="42" x2="879" y2="42" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="26" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="21" r="6" fill="#27C93F"/>
  <text x="440" y="26" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#64748B">yombell@reech-ai — zsh — 880×460</text>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5">

    <!-- $ whoami -->
    <g clip-path="url(#cmd1)">
      <text x="24" y="86"><tspan fill="#22C55E">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#F8FAFC">whoami</tspan></text>
    </g>
    <text x="24" y="114" fill="#94A3B8" opacity="0">
      Yombell Sisniegas <tspan fill="#475569">—</tspan> Full-Stack Engineer <tspan fill="#475569">&amp;</tspan> Founder <tspan fill="#22C55E">@reech-ai</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.25s" fill="freeze"/>
    </text>

    <!-- $ cat about.md -->
    <g clip-path="url(#cmd2)">
      <text x="24" y="150"><tspan fill="#22C55E">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#F8FAFC">cat about.md</tspan></text>
    </g>
    <text x="24" y="178" fill="#94A3B8" opacity="0">
      Building AI-powered platforms from Lima, Peru <tspan fill="#475569">(UTC-5)</tspan>.
      <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.25s" fill="freeze"/>
    </text>
    <text x="24" y="204" fill="#94A3B8" opacity="0">
      Obsessed with clean architecture, great DX and shipping fast.
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.25s" fill="freeze"/>
    </text>

    <!-- $ ls current-focus -->
    <g clip-path="url(#cmd3)">
      <text x="24" y="240"><tspan fill="#22C55E">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#F8FAFC">ls ~/current-focus</tspan></text>
    </g>
    <text x="24" y="268" opacity="0">
      <tspan fill="#38BDF8" font-weight="bold">ai-agents/</tspan><tspan fill="#94A3B8">    </tspan><tspan fill="#38BDF8" font-weight="bold">rag-pipelines/</tspan><tspan fill="#94A3B8">    </tspan><tspan fill="#38BDF8" font-weight="bold">realtime-apps/</tspan><tspan fill="#94A3B8">    </tspan><tspan fill="#38BDF8" font-weight="bold">cloud-architecture/</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="5.7s" dur="0.25s" fill="freeze"/>
    </text>

    <!-- stack list command -->
    <g clip-path="url(#cmd4)">
      <text x="24" y="304"><tspan fill="#22C55E">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#F8FAFC">./stack --list</tspan></text>
    </g>
    <text x="24" y="332" fill="#94A3B8" opacity="0">
      TypeScript <tspan fill="#475569">·</tspan> Next.js <tspan fill="#475569">·</tspan> React <tspan fill="#475569">·</tspan> Node.js <tspan fill="#475569">·</tspan> Supabase <tspan fill="#475569">·</tspan> PostgreSQL <tspan fill="#475569">·</tspan> GCP
      <animate attributeName="opacity" from="0" to="1" begin="7.6s" dur="0.25s" fill="freeze"/>
    </text>

    <!-- $ echo $MISSION -->
    <g clip-path="url(#cmd5)">
      <text x="24" y="368"><tspan fill="#22C55E">➜</tspan><tspan fill="#38BDF8"> ~ </tspan><tspan fill="#F8FAFC">echo $MISSION</tspan></text>
    </g>
    <text x="24" y="396" fill="#22C55E" opacity="0">
      "Turn complex problems into intelligent, scalable products."
      <animate attributeName="opacity" from="0" to="1" begin="9.6s" dur="0.25s" fill="freeze"/>
    </text>

    <!-- Final prompt + blinking cursor -->
    <text x="24" y="432" opacity="0">
      <tspan fill="#22C55E">➜</tspan><tspan fill="#38BDF8"> ~</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="10.2s" dur="0.2s" fill="freeze"/>
    </text>
    <rect x="62" y="418" width="9" height="17" fill="#22C55E" opacity="0">
      <animate attributeName="opacity" values="0;0" begin="0s" dur="10.2s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" begin="10.2s" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
