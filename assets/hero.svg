<svg width="880" height="220" viewBox="0 0 880 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yombell Sisniegas — Full-Stack Engineer and Founder at Reech AI">
  <defs>
    <!-- Animated gradient for the name -->
    <linearGradient id="nameGrad" x1="48" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E;#38BDF8;#A78BFA;#22C55E" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#22C55E;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#22C55E;#38BDF8;#A78BFA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanline gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glows -->
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="218" rx="16"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="878" height="218" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>

  <g clip-path="url(#cardClip)">
    <!-- Grid -->
    <g stroke="#94A3B8" stroke-opacity="0.05" stroke-width="1">
      <path d="M80 0V220"/><path d="M160 0V220"/><path d="M240 0V220"/><path d="M320 0V220"/><path d="M400 0V220"/><path d="M480 0V220"/><path d="M560 0V220"/><path d="M640 0V220"/><path d="M720 0V220"/><path d="M800 0V220"/>
      <path d="M0 55H880"/><path d="M0 110H880"/><path d="M0 165H880"/>
    </g>

    <!-- Ambient glows -->
    <circle cx="760" cy="40" r="190" fill="url(#glowGreen)">
      <animate attributeName="r" values="190;230;190" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="210" r="170" fill="url(#glowBlue)">
      <animate attributeName="r" values="170;210;170" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit system (right side) -->
    <g>
      <circle cx="740" cy="110" r="58" stroke="#1E293B" stroke-width="1.5" fill="none"/>
      <circle cx="740" cy="110" r="86" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
      <!-- Center node -->
      <circle cx="740" cy="110" r="7" fill="#22C55E" filter="url(#softGlow)">
        <animate attributeName="r" values="7;9;7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="110" r="16" stroke="#22C55E" stroke-opacity="0.35" fill="none">
        <animate attributeName="r" values="14;26" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.4;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Inner orbiting node -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 740 110" to="360 740 110" dur="9s" repeatCount="indefinite"/>
        <circle cx="798" cy="110" r="5" fill="#38BDF8" filter="url(#softGlow)"/>
      </g>
      <!-- Outer orbiting nodes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 740 110" to="0 740 110" dur="16s" repeatCount="indefinite"/>
        <circle cx="826" cy="110" r="4" fill="#A78BFA"/>
        <circle cx="654" cy="110" r="3" fill="#22C55E"/>
      </g>
    </g>

    <!-- Scanline sweep -->
    <rect x="-220" y="0" width="220" height="220" fill="url(#scanGrad)" opacity="0.35">
      <animate attributeName="x" values="-220;880" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner brackets -->
    <g stroke="#334155" stroke-width="2" fill="none">
      <path d="M20 34V20H34"/>
      <path d="M846 20H860V34"/>
      <path d="M20 186V200H34"/>
      <path d="M846 200H860V186"/>
    </g>

    <!-- Top-right meta label -->
    <text x="838" y="42" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#475569">// profile v2.0</text>

    <!-- Prompt line -->
    <text x="48" y="62" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#22C55E">~/yombell-sisniegas <tspan fill="#475569">$ init --identity</tspan></text>

    <!-- Name -->
    <text x="46" y="116" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#nameGrad)">Yombell Sisniegas</text>

    <!-- Role -->
    <text x="48" y="148" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Full-Stack Engineer&#160;&#160;·&#160;&#160;Founder @ Reech AI&#160;&#160;·&#160;&#160;Lima, Peru</text>

    <!-- Code line -->
    <text x="48" y="186" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
      <tspan fill="#38BDF8">const</tspan><tspan fill="#F8FAFC"> focus </tspan><tspan fill="#64748B">= [</tspan><tspan fill="#22C55E">"AI Platforms"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#22C55E">"RAG"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#22C55E">"Full-Stack"</tspan><tspan fill="#64748B">];</tspan>
    </text>

    <!-- Blinking cursor -->
    <rect x="494" y="173" width="9" height="17" fill="#22C55E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
